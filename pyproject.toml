[project]
name = "z4j-apscheduler"
version = "1.7.0"
description = "z4j scheduler adapter for APScheduler (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "z4j contributors" }]
keywords = ["z4j", "apscheduler", "scheduler", "cron", "dramatiq"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "z4j-core>=1.7.0,<2",
    # APScheduler compatibility policy: operator-chosen primary,
    # wide range. We touch only get_jobs / remove_job / pause_job /
    # resume_job / JobLookupError - all stable since 3.6. 3.8 is the
    # practical floor (cleaner pytz vs zoneinfo handling that the
    # schedule projections depend on); the previous >=3.11.2 floor
    # excluded the dominant 3.10.x deployed population for no
    # functional reason. ``<4`` guards APScheduler 4.x (currently
    # alpha with substantial API rework) from breaking the adapter.
    "apscheduler>=3.8,<4",
]

[project.urls]
Changelog = "https://github.com/z4jdev/z4j-apscheduler/blob/main/CHANGELOG.md"
Documentation = "https://z4j.dev"
Homepage = "https://z4j.com"
Issues = "https://github.com/z4jdev/z4j-apscheduler/issues"
Source = "https://github.com/z4jdev/z4j-apscheduler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z4j_apscheduler"]
