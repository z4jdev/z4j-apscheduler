[project]
name = "z4j-apscheduler"
version = "1.12.1"
description = "z4j scheduler adapter for APScheduler (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "z4j contributors" }]
keywords = ["z4j", "apscheduler", "scheduler", "cron", "dramatiq"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "z4j-core>=1.12.0,<2",
    # APScheduler 3.10.1 and earlier import pkg_resources, which is not
    # present in the supported runtime closure. APScheduler 3.10.2 is the
    # first measured floor: a real lifecycle path and the adapter suite
    # pass there. No upper bound: a z4j requirement must not hold the
    # dependency below its newest release. APScheduler 4 is a different
    # API; the adapter checks the scheduler it is given and says so
    # itself instead of the resolver refusing the install.
    "apscheduler>=3.10.2",
]

[project.urls]
Changelog = "https://github.com/z4jdev/z4j-apscheduler/blob/main/CHANGELOG.md"
Documentation = "https://docs.z4j.com"
Homepage = "https://z4j.com"
Issues = "https://github.com/z4jdev/z4j-apscheduler/issues"
Source = "https://github.com/z4jdev/z4j-apscheduler"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z4j_apscheduler"]
